<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRA — My Island</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;overflow:hidden;color:#e7f3fb;background:#101f2e}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{border:1px solid #6d91a47d;background:#0c2335df;backdrop-filter:blur(8px);border-radius:13px;padding:10px 13px;box-shadow:0 6px 28px #0b182b70}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:10px}
h1{font-size:15px;letter-spacing:.12em;margin:0}small{font-size:11px;color:#b0c9d4}
#right{text-align:right;font-size:12px}#resources{font-size:10px;color:#d5e6dc}#notice{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#0b273cdb;border-radius:9px;padding:7px 12px;font-size:12px;max-width:85vw;text-align:center}
#objective{position:absolute;top:91px;left:12px;width:min(230px,44vw);border:1px solid #6f8e8c;background:#102a34df;border-radius:11px;padding:8px 10px;box-shadow:0 5px 20px #09172275}
#objective strong{display:block;color:#e5d293;font-size:11px;margin-bottom:3px}#objective small{font-size:10px;line-height:1.4;display:block}
#hotbar{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
button{border:1px solid #799aa8;background:#224459eb;color:white;border-radius:10px;padding:10px 13px;cursor:pointer;touch-action:manipulation;font-size:13px}
button.selected{border-color:#d7f2a9;background:#23675c}button:focus-visible{outline:2px solid #f2df8e}
#quickbar{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:min(520px,calc(100vw - 20px));pointer-events:auto}
.quickSlot{height:52px;padding:4px 2px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;background:#102738ec;border-color:#567280;font-size:18px}
.quickSlot small{font-size:8px;line-height:1;color:#c1d6db}.quickSlot .slotNum{position:absolute;top:2px;left:4px;font-size:8px;color:#9bb2bb}.quickSlot.active{border-color:#f0d27d;background:#29504d;box-shadow:0 0 0 1px #f0d27d66}.quickSlot.empty{opacity:.52}
#joystick{position:absolute;bottom:18px;left:15px;width:126px;height:126px;border-radius:50%;background:#163a5080;border:2px solid #a8d2d47a;pointer-events:auto;touch-action:none;display:grid;place-items:center}
#knob{width:48px;height:48px;border-radius:50%;background:#a9dfd0b8;border:1px solid #e7fff2;box-shadow:0 3px 12px #0006}
#jump{position:absolute;bottom:52px;right:20px;width:74px;height:74px;border-radius:50%;pointer-events:auto}
#grid{position:absolute;right:16px;top:115px;pointer-events:auto}
#help{position:absolute;right:15px;top:166px;width:160px;font-size:11px;line-height:1.65;color:#c4d9e2}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0c1c2d;color:#d3f0e3;font-size:16px;pointer-events:auto;text-align:center;padding:20px}
#loading[hidden]{display:none}
#mining{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);width:min(250px,68vw);background:#102d3cda;border:1px solid #a0cbcb;border-radius:11px;padding:10px 12px;text-align:center;box-shadow:0 5px 20px #061a2b88;pointer-events:none}
#mining[hidden]{display:none}
#miningLabel{font-size:12px;font-weight:700;margin-bottom:6px}
#miningTrack{width:100%;height:10px;background:#334956;border-radius:6px;overflow:hidden}
#miningFill{width:0%;height:100%;background:linear-gradient(90deg,#86bd87,#f0d37f);transition:none}
#placementHint{position:absolute;top:135px;left:50%;transform:translateX(-50%);padding:7px 11px;border:1px solid #d0c07b;background:#172e35eF;border-radius:9px;font-size:11px;white-space:nowrap;box-shadow:0 4px 16px #07131d88}
#placementHint[hidden]{display:none}
#craftPanel{position:absolute;right:14px;top:210px;width:min(340px,calc(100vw - 28px));max-height:min(58vh,520px);overflow:auto;pointer-events:auto;border:1px solid #73919a;background:linear-gradient(150deg,#102a3cF2,#101e2beF);border-radius:14px;padding:13px;box-shadow:0 12px 36px #061322b8}
#craftPanel[hidden]{display:none}#craftPanel h2{font-size:15px;letter-spacing:.04em;margin:0 0 5px}#craftIntro{font-size:11px;color:#b3cbd4;margin-bottom:10px;line-height:1.5}
.recipe{border:1px solid #456373;background:#142f40;border-radius:10px;padding:10px;margin:8px 0}.recipe.locked{opacity:.56}.recipeHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.recipeName{font-size:13px;font-weight:750}.recipeDesc{font-size:11px;color:#afc6d0;margin:4px 0 8px}.recipeCost{font-size:10px;color:#d7e4e7;margin-bottom:7px}.recipe button{padding:7px 10px;font-size:11px}.recipeTag{font-size:10px;color:#e8c879}
@media(pointer:fine){#joystick,#jump{opacity:.38}#joystick:hover,#jump:hover{opacity:1}}
@media(max-width:620px){#top{left:8px;right:8px}.panel{padding:8px 9px}h1{font-size:13px}#hotbar{bottom:max(68px,calc(env(safe-area-inset-bottom) + 62px));gap:4px}#hotbar button{padding:8px 9px;font-size:10px}#quickbar{gap:2px;width:calc(100vw - 12px);bottom:max(7px,env(safe-area-inset-bottom))}.quickSlot{height:46px;font-size:16px;padding:3px 0}#joystick{width:96px;height:96px;bottom:118px;left:8px}#jump{width:62px;height:62px;bottom:132px;right:10px}#help{display:none}#grid{top:100px;right:8px;font-size:11px}#notice{top:77px;font-size:11px}#objective{top:88px;left:8px;width:46vw;padding:7px 8px}#objective strong{font-size:10px}#objective small{font-size:9px}}
</style></head><body>
<div id="hud">
 <div id="top"><div class="panel"><h1>TERRA <span style="color:#93d7b2">/ MY ISLAND</span></h1><small>1인 전용 서버 기반 스카이랜드</small></div><div class="panel" id="right"><span id="revision">저장 상태 확인 중</span><div id="stats">10×10 시작 섬</div><div id="resources">목재 0 · 돌 0 · 밀 0 · 흙 —</div></div></div>
 <div id="notice" role="status" aria-live="polite"></div>
 <div id="objective"><strong id="objectiveTitle">첫 목표</strong><small id="objectiveText">주변 나무를 길게 눌러 목재를 모아봐.</small></div>
 <div id="placementHint" hidden></div>
 <div id="mining" hidden role="status" aria-live="off"><div id="miningLabel">채굴 중 0%</div><div id="miningTrack"><div id="miningFill"></div></div></div>
 <button id="grid">블록 윤곽</button>
 <div id="help">WASD: 이동<br>Space: 점프<br>화면 드래그: 카메라 회전<br>설치: 탭 · 채집/채굴: 길게 누르기<br>나무: <span id="wood">0</span> · 흙: <span id="dirt">—</span></div>
 <div id="joystick" aria-label="이동 조이스틱"><div id="knob"></div></div>
 <button id="jump">점프</button>
 <div id="craftPanel" hidden aria-label="제작 목록"><h2>제작 설계도</h2><div id="craftIntro"></div><div id="recipes"></div></div>
 <div id="hotbar"><button id="place" class="selected">흙 설치 <span id="dirtSmall"></span></button><button id="mine">채집 · 채굴</button><button id="craftToggle">제작</button></div>
 <div id="quickbar" aria-label="아이템 퀵슬롯">
  <button class="quickSlot" data-slot="0" aria-label="슬롯 1"><small class="slotNum">1</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="1" aria-label="슬롯 2"><small class="slotNum">2</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="2" aria-label="슬롯 3"><small class="slotNum">3</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="3" aria-label="슬롯 4"><small class="slotNum">4</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="4" aria-label="슬롯 5"><small class="slotNum">5</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="5" aria-label="슬롯 6"><small class="slotNum">6</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="6" aria-label="슬롯 7"><small class="slotNum">7</small><span></span><small></small></button>
  <button class="quickSlot" data-slot="7" aria-label="슬롯 8"><small class="slotNum">8</small><span></span><small></small></button>
 </div>
 <div id="loading">나만의 섬을 불러오는 중…</div>
</div>
<script type="module" src="/src/game.js"></script>
</body></html>
