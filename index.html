<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRA — My Island</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;overflow:hidden;color:#e7f3fb;background:#101f2e}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{border:1px solid #6d91a47d;background:#0c2335df;backdrop-filter:blur(8px);border-radius:13px;padding:10px 13px;box-shadow:0 6px 28px #0b182b70}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:10px}
h1{font-size:15px;letter-spacing:.12em;margin:0}small{font-size:11px;color:#b0c9d4}
#right{text-align:right;font-size:12px}#notice{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#0b273cdb;border-radius:9px;padding:7px 12px;font-size:12px;max-width:85vw;text-align:center}
#hotbar{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;pointer-events:auto;width:min(640px,calc(100vw - 24px))}
#hotbar button{min-width:0;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
#hotbar .slot-index{font-size:9px;opacity:.6}#hotbar .slot-count{font-size:10px;color:#d1e9d2}
#inventoryButton{position:absolute;right:12px;top:114px;pointer-events:auto}
#inventoryPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 30px));max-height:70vh;overflow:auto;pointer-events:auto;z-index:5}
#inventoryPanel[hidden]{display:none}#inventoryPanel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700}
#inventoryItems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}#inventoryItems button{min-height:55px;padding:8px 3px;font-size:12px}
#equipped{position:absolute;left:50%;transform:translateX(-50%);bottom:73px;background:#153649c9;border-radius:9px;padding:5px 10px;font-size:11px;white-space:nowrap}
#pickups{position:absolute;right:16px;bottom:135px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.pickup{background:#122d39b8;color:#e7f2dc;border-radius:7px;padding:5px 9px;font-size:12px;animation:pickupFade 2.1s ease forwards}
@keyframes pickupFade{0%{opacity:0;transform:translateY(8px)}12%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-13px)}}
button{border:1px solid #799aa8;background:#224459eb;color:white;border-radius:10px;padding:10px 13px;cursor:pointer;touch-action:manipulation;font-size:13px}
button.selected{border-color:#d7f2a9;background:#23675c}button:focus-visible{outline:2px solid #f2df8e}
#joystick{position:absolute;bottom:18px;left:15px;width:126px;height:126px;border-radius:50%;background:#163a5080;border:2px solid #a8d2d47a;pointer-events:auto;touch-action:none;display:grid;place-items:center}
#knob{width:48px;height:48px;border-radius:50%;background:#a9dfd0b8;border:1px solid #e7fff2;box-shadow:0 3px 12px #0006}
#jump{position:absolute;bottom:52px;right:20px;width:74px;height:74px;border-radius:50%;pointer-events:auto}
#grid{position:absolute;right:12px;top:158px;pointer-events:auto}
#help{display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0c1c2d;color:#d3f0e3;font-size:16px;pointer-events:auto;text-align:center;padding:20px}
#loading[hidden]{display:none}
#mining{position:fixed;left:50%;top:50%;transform:translate(-50%,-100%);width:86px;padding:3px;border-radius:7px;background:#0b1b25b8;box-shadow:0 2px 8px #0006;pointer-events:none}
#mining[hidden]{display:none}
#miningTrack{width:100%;height:7px;background:#293d49;border-radius:4px;overflow:hidden}
#miningFill{width:0%;height:100%;background:linear-gradient(90deg,#9ada83,#e5dc85);transition:none}
@media(pointer:fine){#joystick,#jump{opacity:.38}#joystick:hover,#jump:hover{opacity:1}}
@media(max-width:620px){#top{left:8px;right:8px}.panel{padding:8px 9px}h1{font-size:13px}#hotbar{bottom:max(7px,env(safe-area-inset-bottom));gap:3px;width:calc(100vw - 12px)}#hotbar button{padding:7px 1px;font-size:9px;border-radius:6px}#hotbar .slot-index{font-size:8px}#joystick{width:105px;height:105px;bottom:55px;left:8px}#jump{width:64px;height:64px;bottom:85px;right:10px}#equipped{bottom:65px}#grid{top:94px;right:8px;font-size:11px}#inventoryButton{top:138px;right:8px;font-size:11px}#notice{top:77px;font-size:11px}#pickups{bottom:155px;right:10px}}
</style></head><body>
<div id="hud">
 <div id="top"><div class="panel"><h1>TERRA</h1></div><div class="panel" id="right"><span id="stats">16×16</span></div></div>
 <div id="notice" role="status" aria-live="polite"></div>
 <div id="mining" hidden aria-label="채집 진행"><div id="miningTrack"><div id="miningFill"></div></div></div>
 <button id="grid" aria-label="블록 윤곽 토글">윤곽</button>
 <button id="inventoryButton" aria-expanded="false" aria-controls="inventoryPanel">🎒 인벤토리</button>
 <section id="inventoryPanel" class="panel" hidden aria-label="인벤토리"><header><span>인벤토리</span><button id="inventoryClose" aria-label="닫기">✕</button></header><div id="inventoryItems"></div></section>
 <div id="pickups" aria-live="polite" aria-atomic="false"></div>
 <div id="equipped">장착: <span id="equipName">삽</span></div>
 <div id="joystick" aria-label="이동 조이스틱"><div id="knob"></div></div>
 <button id="jump">점프</button>
 <div id="hotbar" role="toolbar" aria-label="8칸 퀵슬롯">
 <button id="slot-pickaxe" data-slot="pickaxe"><span class="slot-index">1</span>⛏️ 곡괭이</button>
 <button id="slot-shovel" data-slot="shovel" class="selected"><span class="slot-index">2</span>삽</button>
 <button id="slot-axe" data-slot="axe"><span class="slot-index">3</span>🪓 도끼</button>
 <button id="slot-dirt" data-slot="dirt"><span class="slot-index">4</span>흙 <span id="count-dirt" class="slot-count">0</span></button>
 <button id="slot-sand" data-slot="sand"><span class="slot-index">5</span>모래 <span id="count-sand" class="slot-count">0</span></button>
 <button id="slot-stone" data-slot="stone"><span class="slot-index">6</span>돌 <span id="count-stone" class="slot-count">0</span></button>
 <button id="slot-ironOre" data-slot="ironOre"><span class="slot-index">7</span>철 <span id="count-ironOre" class="slot-count">0</span></button>
 <button id="slot-wood" data-slot="wood"><span class="slot-index">8</span>목재 <span id="count-wood" class="slot-count">0</span></button>
 </div>
 <div id="loading">나만의 섬을 불러오는 중…</div>
</div>
<script type="module" src="/src/game.js"></script>
</body></html>
