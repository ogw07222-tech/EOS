<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRA — My Island</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;overflow:hidden;color:#e7f3fb;background:#101f2e}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{border:1px solid #6d91a47d;background:#0c2335df;backdrop-filter:blur(8px);border-radius:13px;padding:10px 13px;box-shadow:0 6px 28px #0b182b70}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:10px}
h1{font-size:15px;letter-spacing:.12em;margin:0}small{font-size:11px;color:#b0c9d4}
#right{text-align:right;font-size:12px}#notice{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#0b273cdb;border-radius:9px;padding:7px 12px;font-size:12px;max-width:85vw;text-align:center}
#hotbar{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
button{border:1px solid #799aa8;background:#224459eb;color:white;border-radius:10px;padding:10px 13px;cursor:pointer;touch-action:manipulation;font-size:13px}
button.selected{border-color:#d7f2a9;background:#23675c}button:focus-visible{outline:2px solid #f2df8e}
#joystick{position:absolute;bottom:18px;left:15px;width:126px;height:126px;border-radius:50%;background:#163a5080;border:2px solid #a8d2d47a;pointer-events:auto;touch-action:none;display:grid;place-items:center}
#knob{width:48px;height:48px;border-radius:50%;background:#a9dfd0b8;border:1px solid #e7fff2;box-shadow:0 3px 12px #0006}
#jump{position:absolute;bottom:52px;right:20px;width:74px;height:74px;border-radius:50%;pointer-events:auto}
#grid{position:absolute;right:16px;top:115px;pointer-events:auto}
#help{position:absolute;right:15px;top:166px;width:160px;font-size:11px;line-height:1.65;color:#c4d9e2}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0c1c2d;color:#d3f0e3;font-size:16px;pointer-events:auto;text-align:center;padding:20px}
#loading[hidden]{display:none}
@media(pointer:fine){#joystick,#jump{opacity:.38}#joystick:hover,#jump:hover{opacity:1}}
@media(max-width:620px){#top{left:8px;right:8px}.panel{padding:8px 9px}h1{font-size:13px}#hotbar{bottom:max(11px,env(safe-area-inset-bottom));gap:4px}#hotbar button{padding:9px 10px;font-size:11px}#joystick{width:105px;height:105px;bottom:60px;left:8px}#jump{width:64px;height:64px;bottom:85px;right:10px}#help{display:none}#grid{top:100px;right:8px;font-size:11px}#notice{top:77px;font-size:11px}}
</style></head><body>
<div id="hud">
 <div id="top"><div class="panel"><h1>TERRA <span style="color:#93d7b2">/ MY ISLAND</span></h1><small>1인 전용 서버 기반 스카이랜드</small></div><div class="panel" id="right"><span id="revision">저장 상태 확인 중</span><div id="stats">16×16 시작 섬</div></div></div>
 <div id="notice" role="status" aria-live="polite"></div>
 <button id="grid">블록 윤곽</button>
 <div id="help">WASD: 이동<br>Space: 점프<br>화면 드래그: 카메라 회전<br>블록 탭/클릭: 상호작용<br>흙: <span id="dirt">—</span>개</div>
 <div id="joystick" aria-label="이동 조이스틱"><div id="knob"></div></div>
 <button id="jump">점프</button>
 <div id="hotbar"><button id="place" class="selected">흙 설치 <span id="dirtSmall"></span></button><button id="mine">블록 파괴</button><button disabled title="다음 버전">광맥 (예정)</button></div>
 <div id="loading">나만의 섬을 불러오는 중…</div>
</div>
<script type="module" src="/src/game.js"></script>
</body></html>
