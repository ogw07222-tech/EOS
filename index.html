<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TERRA — Starter Sky Island</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans KR",sans-serif}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101c2a;color:#edf8fa}
canvas{display:block;touch-action:none}#header{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:10px;pointer-events:none}
.panel{background:#112332e8;border:1px solid #6383937a;border-radius:14px;padding:11px 14px;backdrop-filter:blur(10px);box-shadow:0 5px 24px #05172270;pointer-events:auto}
h1{font-size:16px;margin:0;letter-spacing:.14em}p{font-size:12px;color:#bad6dc;margin:5px 0 0}#info{font-size:12px;line-height:1.6;text-align:right}
#toolbar{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:min(96vw,640px);background:#112332e9;border:1px solid #63839380;padding:9px;border-radius:16px}
button{background:#304c5d;color:#f4fcff;border:1px solid #55798a;border-radius:10px;padding:10px 13px;font-size:13px;cursor:pointer}button.active{background:#276b64;border-color:#7ac3a5}
#note{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#102633bd;padding:7px 12px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-width:560px){.panel{padding:8px 10px}h1{font-size:13px}p,#info{font-size:10px}#toolbar{gap:5px;padding:7px}button{padding:9px;font-size:11px}#note{bottom:100px;font-size:10px}}
</style></head><body>
<div id="header"><div class="panel"><h1>TERRA <span style="color:#95cfb1">/ STARTER ISLAND</span></h1><p>16 × 16 · 두께 3 · 평평한 잔디와 흙만</p></div><div class="panel" id="info">Three.js · WebGL<br><span id="readout">지형 생성 중…</span></div></div>
<div id="note">드래그: 회전 · 휠/핀치: 확대 · 드릴·컨베이어 시제품은 별도 보존</div>
<div id="toolbar"><button id="reset">시점 초기화</button><button id="trees" class="active">나무 표시</button><button id="grid">블록 윤곽 표시</button><button id="view">윗면 보기</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const SIZE=16,DEPTH=3,HALF=SIZE/2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ebbd8);scene.fog=new THREE.Fog(0x8ebbd8,34,100);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f4ff,0x665644,2.3));
const sun=new THREE.DirectionalLight(0xffedcb,2.7);sun.position.set(-10,18,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;sun.shadow.bias=-.00015;scene.add(sun);
function rnd(x,y,seed=0){let n=(x*374761393+y*668265263+seed*1274126177)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function texture(type){
const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
const base=type==='grass'?'#6fa76b':type==='rim'?'#8b6448':'#865f44';
c.fillStyle=base;c.fillRect(0,0,64,64);
for(let y=0;y<64;y+=4)for(let x=0;x<64;x+=4){
 let q=rnd(x,y,type==='grass'?11:type==='rim'?19:29);
 const shades=type==='grass'?['#679e62','#80b879','#629660','#78ae70','#83b77b']:['#77543d','#966e4f','#a07b57','#79553f','#8b6348'];
 c.fillStyle=shades[Math.floor(q*shades.length)];
 c.fillRect(x,y,4,4);
 if(type==='grass'&&rnd(x,y,88)>.77){c.fillStyle='#a2c58a';c.fillRect(x+1,y,2,2)}
}
if(type==='rim'){
 // Top edge grassy soil, irregular short roots. UV origin in WebGL is bottom-left.
 c.fillStyle='#5e985c';c.fillRect(0,0,64,9);
 for(let x=0;x<64;x+=4){let d=3+Math.floor(rnd(x,31,4)*5);c.fillStyle='#5e985c';c.fillRect(x,8,4,d)}
}
const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.generateMipmaps=true;return t;
}
const grassTex=texture('grass'),rimTex=texture('rim'),dirtTex=texture('dirt');
const mats=[grassTex,rimTex,dirtTex].map(tex=>new THREE.MeshStandardMaterial({map:tex,roughness:1}));
const positions=[[],[],[]],normals=[[],[],[]],uvs=[[],[],[]],indices=[[],[],[]],offset=[0,0,0];
// Each face is emitted only when exposed; no interior or hidden cube meshes.
function quad(mat,verts,normal){let pos=positions[mat],nor=normals[mat],uv=uvs[mat],idx=indices[mat],at=offset[mat];for(const v of verts){pos.push(...v);nor.push(...normal)}uv.push(0,0,1,0,1,1,0,1);idx.push(at,at+1,at+2,at,at+2,at+3);offset[mat]+=4}
const topY=0,bottomY=-DEPTH;
for(let x=0;x<SIZE;x++)for(let z=0;z<SIZE;z++){
const x0=x-HALF,x1=x0+1,z0=z-HALF,z1=z0+1;
quad(0,[[x0,topY,z1],[x1,topY,z1],[x1,topY,z0],[x0,topY,z0]],[0,1,0]);
quad(2,[[x0,bottomY,z0],[x1,bottomY,z0],[x1,bottomY,z1],[x0,bottomY,z1]],[0,-1,0]);
for(let y=0;y<DEPTH;y++){const hi=-y,lo=hi-1,mat=y===0?1:2;
if(x===0)quad(mat,[[x0,lo,z1],[x0,lo,z0],[x0,hi,z0],[x0,hi,z1]],[-1,0,0]);
if(x===SIZE-1)quad(mat,[[x1,lo,z0],[x1,lo,z1],[x1,hi,z1],[x1,hi,z0]],[1,0,0]);
if(z===0)quad(mat,[[x0,lo,z0],[x1,lo,z0],[x1,hi,z0],[x0,hi,z0]],[0,0,-1]);
if(z===SIZE-1)quad(mat,[[x1,lo,z1],[x0,lo,z1],[x0,hi,z1],[x1,hi,z1]],[0,0,1]);
}}
const geos=positions.map((p,i)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(normals[i],3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs[i],2));g.setIndex(indices[i]);g.computeBoundingSphere();return g});
const island=new THREE.Group();scene.add(island);
geos.forEach((g,i)=>{const mesh=new THREE.Mesh(g,mats[i]);mesh.receiveShadow=true;mesh.castShadow=true;island.add(mesh)});
const edgeGroup=new THREE.Group();island.add(edgeGroup);
const edgeMat=new THREE.LineBasicMaterial({color:0x36442f,transparent:true,opacity:.25});
const pts=[];
for(let x=-HALF;x<=HALF;x++){pts.push(x,.008,-HALF,x,.008,HALF)}
for(let z=-HALF;z<=HALF;z++){pts.push(-HALF,.008,z,HALF,.008,z)}
const gridGeo=new THREE.BufferGeometry();gridGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));edgeGroup.add(new THREE.LineSegments(gridGeo,edgeMat));edgeGroup.visible=false;
const treeGroup=new THREE.Group();scene.add(treeGroup);
const trunkMat=new THREE.MeshStandardMaterial({color:0x79543c,roughness:1}),leafMat=new THREE.MeshStandardMaterial({color:0x397c63,roughness:1}),leafHi=new THREE.MeshStandardMaterial({color:0x56a374,roughness:1});
function cube(parent,w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function tree(x,z,s){const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);treeGroup.add(t);
cube(t,.75,2.8,.75,trunkMat,0,1.4,0);
const foliage=[[0,3.0,0,2.8,1.35,2.8],[-.8,2.7,0,1.7,1,1.6],[.6,3.8,.35,1.7,1.1,1.8],[0,3.2,-.95,1.9,1.05,1.2]];
foliage.forEach(([a,b,c,w,h,d],i)=>cube(t,w,h,d,i%2?leafHi:leafMat,a,b,c));}
tree(-5.0,-4.7,1.0);tree(4.8,4.3,.88);
let yaw=-.7,pitch=.58,dist=29,drag=false,lastX=0,lastY=0,pinchDist=0;
function reset(){yaw=-.7;pitch=.58;dist=29}
document.getElementById('reset').onclick=reset;
document.getElementById('trees').onclick=e=>{treeGroup.visible=!treeGroup.visible;e.target.classList.toggle('active',treeGroup.visible)};
document.getElementById('grid').onclick=e=>{edgeGroup.visible=!edgeGroup.visible;e.target.classList.toggle('active',edgeGroup.visible)};
document.getElementById('view').onclick=()=>{pitch=1.54;yaw=-.7};
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.isPrimary===false)return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.min(1.56,Math.max(.13,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(12,Math.min(55,dist+Math.sign(e.deltaY)*1.5))},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length!==2)return;const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinchDist)dist=Math.max(12,Math.min(55,dist*pinchDist/d));pinchDist=d},{passive:true});
canvas.addEventListener('touchend',()=>pinchDist=0);
document.getElementById('readout').textContent='256개 윗면 · 192개 측면 · 256개 아랫면';
function animate(){requestAnimationFrame(animate);const target=new THREE.Vector3(0,-.6,0);
camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script></body></html>
