<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERRA · 모델 도감</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a1b;color:#e7eee3;font:15px system-ui,sans-serif;color-scheme:dark}main{height:100dvh;display:grid;grid-template-columns:minmax(245px,29%) 1fr}aside{background:#162320;display:flex;min-height:0;flex-direction:column;padding:24px 16px;gap:12px;border-right:1px solid #43574a}h1,h2,p{margin:0}h1{font-size:24px;letter-spacing:-.05em}small,code,#count{color:#a4c6ad}header{display:flex;align-items:baseline;justify-content:space-between}input,select,button{font:inherit;color:inherit}input,select{background:#101b18;border:1px solid #415347;padding:9px;border-radius:6px;width:100%}#list{overflow:auto;display:flex;flex-direction:column;gap:3px}button{cursor:pointer;background:#24342d;border:0;border-radius:5px;padding:9px 13px}#list button{text-align:left;background:transparent}#list button[aria-pressed=true]{background:#334c3c;color:#d1f0b1}section{position:relative;min-height:0;min-width:0;background:radial-gradient(ellipse at 50% 40%,#354342,#152325 70%)}canvas{display:block;width:100%;height:100%;touch-action:none}article,footer{position:absolute;left:5%;right:5%;pointer-events:none}article{top:5%}footer{bottom:5%;display:flex;align-items:center;justify-content:space-between;gap:6px;color:#bacbc1;font-size:13px}footer button{pointer-events:auto}#status{position:absolute;top:50%;left:8%;right:8%;text-align:center}a{color:#b5d5b7}small{letter-spacing:.08em}@media(max-width:680px){main{grid-template-columns:1fr;grid-template-rows:52% 48%}aside{grid-row:2;padding:10px 14px;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto auto 1fr;gap:7px}header,#list{grid-column:1/-1}h1{font-size:18px}h2{font-size:20px}section{grid-row:1}footer{bottom:3%}}
</style></head><body><main><aside><header><h1>TERRA 모델 도감</h1><span id="count"></span></header><input id="search" type="search" placeholder="모델명 또는 ID 검색" aria-label="모델 검색"><select id="category" aria-label="분류"><option value="">전체 분류</option></select><nav id="list" aria-label="모델 목록"></nav></aside><section><canvas aria-label="3D 모델"></canvas><article><small id="kind"></small><h2 id="title"></h2><code id="modelId"></code></article><p role="status" id="status">도감을 불러오는 중…</p><footer><span>드래그 회전 · 핀치 / 휠 확대</span><button id="reset">시점 복귀</button></footer></section></main><script type="module">import('./src/model-gallery.js').catch(e=>{document.querySelector('#status').textContent='도감을 열 수 없습니다. '+e.message})</script></body></html>
